spring:
  application:
    name: docbrain

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docbrain}
    username: ${POSTGRES_USER:docbrain}
    password: ${POSTGRES_PASSWORD:docbrain}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

docbrain:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long!!}
    expiration-ms: 86400000
  chunking:
    chunk-size: ${CHUNK_SIZE:1000}
    chunk-overlap: ${CHUNK_OVERLAP:200}
  embedding:
    dimension: ${EMBEDDING_DIMENSION:1536}
  ai:
    provider: ${AI_PROVIDER:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  rag:
    top-k: ${RAG_TOP_K:5}
    max-history-pairs: ${RAG_MAX_HISTORY_PAIRS:5}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/docbrain_test
  flyway:
    clean-disabled: false
