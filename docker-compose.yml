services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docbrain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docbrain}
      POSTGRES_USER: ${POSTGRES_USER:-docbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docbrain} -d ${POSTGRES_DB:-docbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
