services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docbrain-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docbrain}
      POSTGRES_USER: ${POSTGRES_USER:-docbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docbrain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docbrain} -d ${POSTGRES_DB:-docbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docbrain-net

  backend:
    build: ./backend
    container_name: docbrain-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-docbrain}
      POSTGRES_USER: ${POSTGRES_USER:-docbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docbrain}
      JWT_SECRET: ${JWT_SECRET:-default-dev-secret-change-in-production-must-be-at-least-256-bits-long!!}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - docbrain-net

  frontend:
    build: ./frontend
    container_name: docbrain-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - docbrain-net

volumes:
  pgdata:

networks:
  docbrain-net:
    driver: bridge
